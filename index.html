<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Organizada</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: #000;
        }

        h1 {
            margin-top: 20px;
            font-size: 1.5em;
            color: #e0e0e0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .breadcrumb {
            width: 90%;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
            color: #f0f0f0;
            letter-spacing: 1px;
            z-index: 3;
            pointer-events: auto;
        }

        .breadcrumb a {
            color: #ff6f61;
            text-decoration: none;
            margin-right: 5px;
            transition: color 0.3s ease;
        }

        .breadcrumb a:hover {
            color: #ffd700;
        }

        .organogram {
            text-align: center;
            width: 70%;
            background: rgba(218, 216, 216, 0.801);
            padding: 5px;
            border-radius: 8px;
            margin-bottom: 10px;
            pointer-events: auto;
            z-index: 2;
        }

        .organogram.hidden {
            display: none;
        }

        .level {
            display: none;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .level.active {
            display: flex;
        }

        .option {
            background-color: rgba(255, 111, 97, 0.1);
            color: #ff6f61;
            border: 2px solid #ff6f61;
            padding: 10px 15px;
            margin: 10px;
            cursor: pointer;
            width: 150px;
            text-align: center;
            transition: background-color 0.3s ease, transform 0.2s ease;
            border-radius: 8px;
            font-size: 1.1em;
        }

        .option:hover {
            background-color: #ff6f61;
            color: #fff;
            transform: scale(1.05);
        }

        .back-button {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 3;
            background-color: transparent;
            color: #ff6f61;
            border: 2px solid #ff6f61;
            padding: 8px 20px;
            margin: 15px;
            cursor: pointer;
            display: none;
            font-size: 1em;
            transition: background-color 0.3s ease, color 0.3s ease;
            border-radius: 8px;
            pointer-events: auto;
        }

        .back-button.active {
            display: block;
        }

        .back-button:hover {
            background-color: #ff6f61;
            color: #fff;
        }

        .container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        #map {
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 20px;
            color: #fff;
            pointer-events: none;
        }

        #overlay .organogram, 
        #overlay .back-button,
        #overlay .breadcrumb, 
        #overlay .results-container {
            pointer-events: auto;
        }

        .results-container {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 8px 8px 0 0;
            display: none;
            max-height: 30%;
            overflow-y: auto;
            z-index: 3;
        }

        .results-container.active {
            display: block;
        }

        .results {
            margin-top: 10px;
            padding: 10px;
            background-color: rgba(255, 111, 97, 0.1);
            border: 2px solid #ff6f61;
            border-radius: 10px;
            overflow-y: auto;
        }

        .option, .back-button, .breadcrumb a {
            transition: all 0.3s ease;
        }

        .loader {
            border: 8px solid #f3f3f3;
            border-radius: 50%;
            border-top: 8px solid #ff6f61;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

</head>
<body>
    <div class="container">
        <div id="map"></div>
    
        <!-- Camada transparente acima do mapa -->
        <div id="overlay">
            <div class="breadcrumb" id="breadcrumb"></div>
            <div id="organogram" class="organogram">
                <div id="level-1" class="level active"></div>
            </div>
    
            <!-- Grupo de botões -->
            <div class="button-group">
                <button id="back-button" onclick="goBack()">Voltar</button>
            </div>
    
            <!-- Resultados e carregamento -->
            <div class="results-container">
                <div id="results" class="results"></div>
                <div id="loader" class="loader" style="display: none;"></div>
            </div>
        </div>
    </div>        

    <script>
        let currentLevel = 1;
        const breadcrumb = document.getElementById('breadcrumb');
        const historyStack = [];
        let finalCodigoServico = null;
        let userLocation = null;
        let markers = {};

        document.addEventListener('DOMContentLoaded', function() {
            loadOptions(1, null);
            initMap(); // Inicializa o mapa ao carregar a página
        });

        function loadOptions(level, parentId) {
            const xhr = new XMLHttpRequest();
            xhr.open('POST', 'carregar_opcoes.php', true);
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.onload = function() {
                if (xhr.status === 200) {
                    const options = JSON.parse(xhr.responseText);
                    const levelDiv = document.getElementById(`level-${level}`);

                    if (options.length > 0) {
                        levelDiv.innerHTML = '';
                        options.forEach(option => {
                            const optionDiv = document.createElement('div');
                            optionDiv.classList.add('option');
                            optionDiv.textContent = option.nome;
                            optionDiv.onclick = () => selectOption(option.id, option.nome, level + 1, option.codigo);
                            levelDiv.appendChild(optionDiv);
                        });
                    } else {
                        finalizarEscolha();
                    }
                } else {
                    console.error('Erro ao carregar as opções');
                }
            };
            xhr.send(JSON.stringify({ nivel: level, parent_id: parentId }));
        }

        function selectOption(id, optionText, nextLevel, codigoServico) {
            historyStack.push({ id, text: optionText, level: currentLevel });
            finalCodigoServico = codigoServico;
            updateBreadcrumb();

            if (nextLevel <= 6) {
                const newLevelDiv = document.createElement('div');
                newLevelDiv.id = `level-${nextLevel}`;
                newLevelDiv.classList.add('level');
                document.getElementById('organogram').appendChild(newLevelDiv);
                document.getElementById(`level-${currentLevel}`).classList.remove('active');
                newLevelDiv.classList.add('active');
                currentLevel = nextLevel;
                loadOptions(nextLevel, id);
            } else {
                finalizarEscolha();
            }
            updateBackButton();
        }

        function finalizarEscolha() {
            if (finalCodigoServico && userLocation) {
                showLoader();
                buscarDados(finalCodigoServico, userLocation);
                document.querySelector('.results-container').classList.add('active');
            } else {
                console.error('Erro: Código de serviço ou localização não encontrado.');
            }
        }

        function buscarDados(codigoServico, location) {
            const xhr = new XMLHttpRequest();
            xhr.open('POST', 'buscar_empresas.php', true);
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.onload = function() {
                hideLoader();
                if (xhr.status === 200) {
                    const results = JSON.parse(xhr.responseText);
                    const resultsDiv = document.getElementById('results');
                    resultsDiv.innerHTML = '';
                    if (results.length > 0) {
                        results.forEach(result => {
                            const resultDiv = document.createElement('div');
                            resultDiv.textContent = `${result.nome} - ${result.preco}`;
                            resultDiv.classList.add('result');
                            resultDiv.onclick = () => moveToLocation(result.latitude, result.longitude, result.nome, result.preco);
                            resultsDiv.appendChild(resultDiv);
                            // Adiciona marcador ao mapa
                            addMarker(result.latitude, result.longitude, result.nome, result.preco);
                        });
                    } else {
                        resultsDiv.textContent = 'Nenhuma empresa encontrada.';
                    }
                } else {
                    console.error('Erro ao buscar empresas');
                }
            };
            xhr.send(JSON.stringify({ codigoServico, latitude: location.lat, longitude: location.lng }));
        }

        function moveToLocation(lat, lng, name, price) {
            const map = markers[name];
            map.setLatLng([lat, lng]);
            map.openPopup();
        }

        function updateBreadcrumb() {
            breadcrumb.innerHTML = '';
            historyStack.forEach((step, index) => {
                const link = document.createElement('a');
                link.textContent = step.text;
                link.onclick = () => goToStep(index);
                breadcrumb.appendChild(link);
            });
        }

        function goToStep(index) {
            historyStack.splice(index + 1);
            currentLevel = historyStack[historyStack.length - 1].level;
            updateBreadcrumb();
            updateBackButton();
            loadOptions(currentLevel, historyStack[currentLevel - 1].id);
        }

        function goBack() {
            if (historyStack.length > 0) {
                historyStack.pop();
                currentLevel--;
                updateBreadcrumb();
                updateBackButton();
                loadOptions(currentLevel, historyStack[historyStack.length - 1]?.id);
            }
        }

        function updateBackButton() {
            const backButton = document.getElementById('back-button');
            backButton.style.display = historyStack.length > 0 ? 'block' : 'none';
        }

        function showLoader() {
            document.getElementById('loader').style.display = 'block';
        }

        function hideLoader() {
            document.getElementById('loader').style.display = 'none';
        }

        function initMap() {
            navigator.geolocation.getCurrentPosition(function(position) {
                userLocation = {
                    lat: position.coords.latitude,
                    lng: position.coords.longitude
                };

                const map = L.map('map').setView([userLocation.lat, userLocation.lng], 13);

                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap'
                }).addTo(map);

                // Define o marcador do usuário
                const userMarker = L.marker([userLocation.lat, userLocation.lng]).addTo(map);
                userMarker.bindPopup("<b>Você está aqui!</b>").openPopup();

                // Função para adicionar marcadores de empresas ao mapa
                function addMarker(lat, lng, name, price) {
                    const marker = L.marker([lat, lng]).addTo(map);
                    marker.bindPopup(`<b>${name}</b><br>Preço: ${price}`);
                    markers[name] = marker;
                }
            });
        }
    </script>
</body>
</html>
